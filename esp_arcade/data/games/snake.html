<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake Retro - ESP32 Arcade</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .snake-board {
            width: 360px;
            height: 360px;
            max-width: 92vw;
            max-height: 92vw;
        }
    </style>
</head>
<body>
    <header>
        <a href="../index.html" class="back-btn" onclick="sfx.click()">◀ Retour au Menu</a>
        <div class="score-panel">
            <div class="score-box">
                <div class="label">Score</div>
                <div class="value" id="current-score">0</div>
            </div>
            <div class="score-box best">
                <div class="label">Record</div>
                <div class="value" id="best-score">0</div>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="game-wrapper">
            <div class="canvas-container">
                <canvas id="gameCanvas" class="snake-board" width="360" height="360"></canvas>
                
                <div id="overlay" class="game-overlay">
                    <h2 id="overlay-title">SNAKE RETRO</h2>
                    <p id="overlay-msg">Utilise les touches fléchées ou le pavé tactile</p>
                    <button class="btn-primary" id="start-btn">Jouer ▶</button>
                </div>
            </div>

            <!-- Virtual D-PAD for touch devices -->
            <div class="touch-controls">
                <div class="dpad-row">
                    <button class="dpad-btn" id="btn-up">▲</button>
                </div>
                <div class="dpad-row">
                    <button class="dpad-btn" id="btn-left">◀</button>
                    <button class="dpad-btn" id="btn-down">▼</button>
                    <button class="dpad-btn" id="btn-right">▶</button>
                </div>
            </div>
        </div>
    </main>

    <script src="../audio.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('current-score');
        const bestEl = document.getElementById('best-score');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayMsg = document.getElementById('overlay-msg');
        const startBtn = document.getElementById('start-btn');

        const GRID_SIZE = 18;
        const TILE_COUNT = canvas.width / GRID_SIZE; // 20x20

        let snake = [];
        let food = { x: 15, y: 15 };
        let dx = 0;
        let dy = 0;
        let nextDx = 0;
        let nextDy = 0;
        let score = 0;
        let bestScore = parseInt(localStorage.getItem('snake_highscore') || '0', 10);
        let gameLoop = null;
        let isRunning = false;
        let gameSpeed = 110;

        bestEl.textContent = bestScore;

        function initGame() {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            dx = 1;
            dy = 0;
            nextDx = 1;
            nextDy = 0;
            score = 0;
            gameSpeed = 110;
            scoreEl.textContent = '0';
            placeFood();
            isRunning = true;
            overlay.classList.add('hidden');
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(update, gameSpeed);
        }

        function placeFood() {
            let valid = false;
            while (!valid) {
                food.x = Math.floor(Math.random() * TILE_COUNT);
                food.y = Math.floor(Math.random() * TILE_COUNT);
                valid = !snake.some(segment => segment.x === food.x && segment.y === food.y);
            }
        }

        function setDirection(newDx, newDy) {
            if (!isRunning) return;
            // Empêcher le demi-tour direct
            if ((newDx !== 0 && dx === -newDx) || (newDy !== 0 && dy === -newDy)) {
                return;
            }
            nextDx = newDx;
            nextDy = newDy;
        }

        function update() {
            dx = nextDx;
            dy = nextDy;

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Collision avec les murs
            if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
                gameOver();
                return;
            }

            // Collision avec soi-même
            if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                gameOver();
                return;
            }

            snake.unshift(head);

            // Manger la nourriture
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.textContent = score;
                sfx.score();

                if (score > bestScore) {
                    bestScore = score;
                    bestEl.textContent = bestScore;
                    localStorage.setItem('snake_highscore', bestScore);
                }

                placeFood();

                // Accélération légère
                if (gameSpeed > 60 && score % 40 === 0) {
                    gameSpeed -= 5;
                    clearInterval(gameLoop);
                    gameLoop = setInterval(update, gameSpeed);
                }
            } else {
                snake.pop();
            }

            draw();
        }

        function draw() {
            // Effacer le fond
            ctx.fillStyle = '#0a0d14';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Grille subtile
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += GRID_SIZE) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }

            // Dessiner la nourriture (effet néon)
            ctx.fillStyle = '#ff0055';
            ctx.shadowColor = '#ff0055';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            const foodRadius = (GRID_SIZE / 2) - 2;
            ctx.arc(
                food.x * GRID_SIZE + GRID_SIZE / 2,
                food.y * GRID_SIZE + GRID_SIZE / 2,
                foodRadius,
                0, Math.PI * 2
            );
            ctx.fill();

            // Dessiner le serpent
            snake.forEach((segment, index) => {
                ctx.shadowColor = index === 0 ? '#00ff66' : '#00f3ff';
                ctx.shadowBlur = index === 0 ? 8 : 4;
                ctx.fillStyle = index === 0 ? '#00ff66' : '#00f3ff';

                const pad = 1;
                ctx.fillRect(
                    segment.x * GRID_SIZE + pad,
                    segment.y * GRID_SIZE + pad,
                    GRID_SIZE - pad * 2,
                    GRID_SIZE - pad * 2
                );
            });

            ctx.shadowBlur = 0;
        }

        function gameOver() {
            isRunning = false;
            clearInterval(gameLoop);
            sfx.gameover();
            overlayTitle.textContent = "GAME OVER";
            overlayTitle.className = "";
            overlayMsg.textContent = `Score final : ${score}`;
            startBtn.textContent = "Rejouer ↺";
            overlay.classList.remove('hidden');
        }

        // Clavier
        window.addEventListener('keydown', e => {
            switch (e.key) {
                case 'ArrowUp': case 'z': case 'w':
                    setDirection(0, -1);
                    e.preventDefault();
                    break;
                case 'ArrowDown': case 's':
                    setDirection(0, 1);
                    e.preventDefault();
                    break;
                case 'ArrowLeft': case 'q': case 'a':
                    setDirection(-1, 0);
                    e.preventDefault();
                    break;
                case 'ArrowRight': case 'd':
                    setDirection(1, 0);
                    e.preventDefault();
                    break;
                case ' ':
                    if (!isRunning) initGame();
                    e.preventDefault();
                    break;
            }
        });

        // Boutons virtuels D-Pad
        document.getElementById('btn-up').addEventListener('touchstart', (e) => { e.preventDefault(); setDirection(0, -1); });
        document.getElementById('btn-down').addEventListener('touchstart', (e) => { e.preventDefault(); setDirection(0, 1); });
        document.getElementById('btn-left').addEventListener('touchstart', (e) => { e.preventDefault(); setDirection(-1, 0); });
        document.getElementById('btn-right').addEventListener('touchstart', (e) => { e.preventDefault(); setDirection(1, 0); });

        document.getElementById('btn-up').addEventListener('click', () => setDirection(0, -1));
        document.getElementById('btn-down').addEventListener('click', () => setDirection(0, 1));
        document.getElementById('btn-left').addEventListener('click', () => setDirection(-1, 0));
        document.getElementById('btn-right').addEventListener('click', () => setDirection(1, 0));

        // Swipe tactile sur le canvas
        let touchStartX = 0;
        let touchStartY = 0;
        canvas.addEventListener('touchstart', e => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        canvas.addEventListener('touchend', e => {
            if (!isRunning) return;
            const dxTouch = e.changedTouches[0].clientX - touchStartX;
            const dyTouch = e.changedTouches[0].clientY - touchStartY;
            if (Math.abs(dxTouch) > Math.abs(dyTouch)) {
                if (dxTouch > 25) setDirection(1, 0);
                else if (dxTouch < -25) setDirection(-1, 0);
            } else {
                if (dyTouch > 25) setDirection(0, 1);
                else if (dyTouch < -25) setDirection(0, -1);
            }
        }, { passive: true });

        startBtn.addEventListener('click', () => {
            sfx.click();
            initGame();
        });

        draw();
    </script>
</body>
</html>
