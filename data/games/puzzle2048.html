<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2048 Cyber - ESP32 Arcade</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .grid-container {
            width: 340px;
            height: 340px;
            max-width: 90vw;
            max-height: 90vw;
            background: #111422;
            border: 2px solid var(--card-border);
            border-radius: 16px;
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.15);
            position: relative;
        }

        .tile {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            font-weight: 800;
            color: #fff;
            transition: transform 0.1s ease-in-out;
        }

        .tile-2    { background: #1f293d; color: #00f3ff; }
        .tile-4    { background: #1c3d5a; color: #00f3ff; box-shadow: 0 0 8px rgba(0, 243, 255, 0.2); }
        .tile-8    { background: #b45309; color: #fff; }
        .tile-16   { background: #d97706; color: #fff; box-shadow: 0 0 10px rgba(217, 119, 6, 0.4); }
        .tile-32   { background: #dc2626; color: #fff; }
        .tile-64   { background: #e11d48; color: #fff; box-shadow: 0 0 12px rgba(225, 29, 72, 0.5); }
        .tile-128  { background: #7c3aed; color: #ffe600; font-size: 1.4rem; }
        .tile-256  { background: #9333ea; color: #ffe600; font-size: 1.4rem; box-shadow: 0 0 15px rgba(147, 51, 234, 0.6); }
        .tile-512  { background: #059669; color: #fff; font-size: 1.3rem; }
        .tile-1024 { background: #00b4d8; color: #fff; font-size: 1.1rem; box-shadow: 0 0 18px rgba(0, 180, 216, 0.7); }
        .tile-2048 { background: linear-gradient(135deg, #ffe600, #ff0055); color: #000; font-size: 1.1rem; box-shadow: 0 0 25px rgba(255, 230, 0, 0.9); }
    </style>
</head>
<body>
    <header>
        <a href="../index.html" class="back-btn" onclick="sfx.click()">◀ Retour au Menu</a>
        <div class="score-panel">
            <div class="score-box">
                <div class="label">Score</div>
                <div class="value" id="current-score">0</div>
            </div>
            <div class="score-box best">
                <div class="label">Record</div>
                <div class="value" id="best-score">0</div>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="game-wrapper">
            <div style="position: relative;">
                <div class="grid-container" id="grid"></div>

                <div id="overlay" class="game-overlay hidden">
                    <h2 id="overlay-title">2048 CYBER</h2>
                    <p id="overlay-msg">Fusionne les blocs identiques !</p>
                    <button class="btn-primary" id="start-btn">Rejouer ↺</button>
                </div>
            </div>

            <!-- Virtual D-PAD for touch devices -->
            <div class="touch-controls">
                <div class="dpad-row">
                    <button class="dpad-btn" id="btn-up">▲</button>
                </div>
                <div class="dpad-row">
                    <button class="dpad-btn" id="btn-left">◀</button>
                    <button class="dpad-btn" id="btn-down">▼</button>
                    <button class="dpad-btn" id="btn-right">▶</button>
                </div>
            </div>
        </div>
    </main>

    <script src="../audio.js"></script>
    <script>
        const gridEl = document.getElementById('grid');
        const scoreEl = document.getElementById('current-score');
        const bestEl = document.getElementById('best-score');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayMsg = document.getElementById('overlay-msg');
        const startBtn = document.getElementById('start-btn');

        let board = Array(4).fill(null).map(() => Array(4).fill(0));
        let score = 0;
        let bestScore = parseInt(localStorage.getItem('2048_highscore') || '0', 10);
        let hasWon = false;

        bestEl.textContent = bestScore;

        function initGame() {
            board = Array(4).fill(null).map(() => Array(4).fill(0));
            score = 0;
            scoreEl.textContent = '0';
            hasWon = false;
            overlay.classList.add('hidden');
            addRandomTile();
            addRandomTile();
            render();
        }

        function addRandomTile() {
            const emptyCells = [];
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    if (board[r][c] === 0) emptyCells.push({ r, c });
                }
            }
            if (emptyCells.length === 0) return;
            const spot = emptyCells[Math.floor(Math.random() * emptyCells.length)];
            board[spot.r][spot.c] = Math.random() < 0.9 ? 2 : 4;
        }

        function render() {
            gridEl.innerHTML = '';
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    const val = board[r][c];
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    if (val > 0) {
                        tile.classList.add(`tile-${val}`);
                        tile.textContent = val;
                    }
                    gridEl.appendChild(tile);
                }
            }
        }

        function slide(row) {
            let arr = row.filter(val => val !== 0);
            let gained = 0;
            for (let i = 0; i < arr.length - 1; i++) {
                if (arr[i] === arr[i + 1]) {
                    arr[i] *= 2;
                    gained += arr[i];
                    if (arr[i] === 2048 && !hasWon) {
                        hasWon = true;
                        sfx.win();
                    }
                    arr.splice(i + 1, 1);
                }
            }
            while (arr.length < 4) {
                arr.push(0);
            }
            return { row: arr, gained };
        }

        function moveLeft() {
            let moved = false;
            let totalGained = 0;
            for (let r = 0; r < 4; r++) {
                const res = slide(board[r]);
                if (res.row.join(',') !== board[r].join(',')) moved = true;
                board[r] = res.row;
                totalGained += res.gained;
            }
            if (moved) handleMoveResult(totalGained);
        }

        function moveRight() {
            let moved = false;
            let totalGained = 0;
            for (let r = 0; r < 4; r++) {
                const reversed = [...board[r]].reverse();
                const res = slide(reversed);
                const newRow = res.row.reverse();
                if (newRow.join(',') !== board[r].join(',')) moved = true;
                board[r] = newRow;
                totalGained += res.gained;
            }
            if (moved) handleMoveResult(totalGained);
        }

        function moveUp() {
            let moved = false;
            let totalGained = 0;
            for (let c = 0; c < 4; c++) {
                let col = [board[0][c], board[1][c], board[2][c], board[3][c]];
                const res = slide(col);
                for (let r = 0; r < 4; r++) {
                    if (board[r][c] !== res.row[r]) moved = true;
                    board[r][c] = res.row[r];
                }
                totalGained += res.gained;
            }
            if (moved) handleMoveResult(totalGained);
        }

        function moveDown() {
            let moved = false;
            let totalGained = 0;
            for (let c = 0; c < 4; c++) {
                let col = [board[3][c], board[2][c], board[1][c], board[0][c]];
                const res = slide(col);
                const reversed = res.row.reverse();
                for (let r = 0; r < 4; r++) {
                    if (board[r][c] !== reversed[r]) moved = true;
                    board[r][c] = reversed[r];
                }
                totalGained += res.gained;
            }
            if (moved) handleMoveResult(totalGained);
        }

        function handleMoveResult(gained) {
            if (gained > 0) {
                score += gained;
                scoreEl.textContent = score;
                sfx.score();
                if (score > bestScore) {
                    bestScore = score;
                    bestEl.textContent = bestScore;
                    localStorage.setItem('2048_highscore', bestScore);
                }
            } else {
                sfx.click();
            }

            addRandomTile();
            render();

            if (checkGameOver()) {
                sfx.gameover();
                overlayTitle.textContent = "PARTIE TERMINÉE";
                overlayMsg.textContent = `Score final : ${score}`;
                overlay.classList.remove('hidden');
            }
        }

        function checkGameOver() {
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    if (board[r][c] === 0) return false;
                    if (c < 3 && board[r][c] === board[r][c + 1]) return false;
                    if (r < 3 && board[r][c] === board[r + 1][c]) return false;
                }
            }
            return true;
        }

        // Contrôles Clavier
        window.addEventListener('keydown', e => {
            switch (e.key) {
                case 'ArrowLeft': case 'q': case 'a': moveLeft(); e.preventDefault(); break;
                case 'ArrowRight': case 'd': moveRight(); e.preventDefault(); break;
                case 'ArrowUp': case 'z': case 'w': moveUp(); e.preventDefault(); break;
                case 'ArrowDown': case 's': moveDown(); e.preventDefault(); break;
            }
        });

        // Contrôles Boutons D-Pad
        document.getElementById('btn-up').addEventListener('click', moveUp);
        document.getElementById('btn-down').addEventListener('click', moveDown);
        document.getElementById('btn-left').addEventListener('click', moveLeft);
        document.getElementById('btn-right').addEventListener('click', moveRight);

        // Swipe tactile sur la grille
        let touchStartX = 0;
        let touchStartY = 0;
        gridEl.addEventListener('touchstart', e => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        gridEl.addEventListener('touchend', e => {
            const dx = e.changedTouches[0].clientX - touchStartX;
            const dy = e.changedTouches[0].clientY - touchStartY;
            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 30) moveRight();
                else if (dx < -30) moveLeft();
            } else {
                if (dy > 30) moveDown();
                else if (dy < -30) moveUp();
            }
        }, { passive: true });

        startBtn.addEventListener('click', () => {
            sfx.click();
            initGame();
        });

        initGame();
    </script>
</body>
</html>
